<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <h2>To do app</h2>
    </header>

    <section>
        <div class="NewTask">
            <p>
                Add new task 
            </p>
            <i data-lucide="plus"></i>

        </div>
    </section>

    <section>
        <div class="overlay">
            <div class="addTask">
                <div id="addTask-heading">
                    <h3>Add new task</h3>
                    <div class="closepopup"> <i data-lucide="x"></i> </div>
                </div>
                <form>
                    <input type="text" id="taskInput" placeholder="Add task here" required>
                    <input type="date" id="dateInput" required>
                    <button type="submit" class="addtaskbtn">Add Task</button>
                </form>

            </div>
        </div>
    </section>

    <section>
        <div class="taskListContainer">
            <h2>My tasks</h2>
            <div class="taskList"></div>
        </div>
    </section>

    <section>
        <div class="CompletedTasksContainer">
            <h2>CompletedTasks</h2>
            <div class="CompletedTasks"></div>
        </div>
    </section>

    <script>
        lucide.createIcons();
    </script>
    <script src="script.js"></script>
</body>

</html>
